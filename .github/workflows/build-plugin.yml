name: Build Linux plugins

'on':
  push:
  workflow_dispatch:
    inputs:
      check_known_host_bug:
        description: 'Also run the strict known-failing CPA disable regression (expected to fail)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -trimpath -buildvcs=true
      TARGET_ARCH: ${{ matrix.arch }}
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/hostcheck/go.sum

      - name: Complete offline checks and verify C-shared plugin
        run: bash scripts/ci-build.sh

      - name: Upload plugin and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Reproduce known host disable failure (opt-in, strict)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_known_host_bug }}
        run: |
          set -o pipefail
          GOPROXY=off GOSUMDB=off make hostcheck-known-bug 2>&1 | tee build/ci-logs/known-host-disable.log

      - name: Retain build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci-logs/
          if-no-files-found: warn
          retention-days: 14

name: Build Linux plugins

'on':
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -trimpath -buildvcs=true
      TARGET_ARCH: ${{ matrix.arch }}
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/hostcheck/go.sum

      - name: Complete offline checks and verify C-shared plugin
        run: bash scripts/ci-build.sh

      - name: Upload plugin and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Retain build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci-logs/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  publish:
    name: Publish verified tag release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified amd64 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: opencode-linux-amd64-${{ github.sha }}
          path: build/release-input/amd64

      - name: Download verified arm64 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: opencode-linux-arm64-${{ github.sha }}
          path: build/release-input/arm64

      - name: Verify both builds and prepare architecture archives
        id: prepare
        run: |
          manifest="$(python3 scripts/release_assets.py prepare \
            --event "$GITHUB_EVENT_PATH" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --inputs build/release-input --output build/release-assets)"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Upload verified draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ steps.prepare.outputs.manifest }}
        run: |
          python3 scripts/release_assets.py publish \
            --event "$GITHUB_EVENT_PATH" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --manifest "$RELEASE_MANIFEST"
